<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fråga mamma</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #f8faff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 1px solid #eef0f6;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 20px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a65, #e91e8c);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .header-title { font-weight: 800; font-size: 18px; color: #1a1a2e; }
    .header-status { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }

    #chat {
      flex: 1; overflow-y: auto;
      padding: 24px 16px;
      max-width: 680px; width: 100%; margin: 0 auto;
    }

    .welcome-box {
      background: white; border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      margin-bottom: 24px;
      border: 1px solid #f0f0f8;
    }
    .welcome-box h2 { color: #1a1a2e; font-size: 20px; font-weight: 700; margin: 8px 0; }
    .welcome-box p { color: #64748b; font-size: 15px; line-height: 1.7; }

    .section-label {
      color: #94a3b8; font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }

    .category-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 32px;
    }
    .cat-btn {
      padding: 14px 16px; border-radius: 16px;
      border: 1.5px solid #eef0f6; background: white;
      color: #1a1a2e; cursor: pointer; font-size: 14px; font-weight: 600;
      text-align: left; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.15s;
    }
    .cat-btn:hover { border-color: #6366f1; box-shadow: 0 4px 12px rgba(99,102,241,0.15); }
    .cat-emoji { font-size: 20px; }

    .message { display: flex; margin-bottom: 16px; align-items: flex-end; gap: 10px; }
    .message.user { justify-content: flex-end; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 12px;
      background: linear-gradient(135deg, #ff8a65, #e91e8c);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .bubble {
      max-width: 75%; border-radius: 20px;
      padding: 13px 18px; font-size: 15px; line-height: 1.7;
      white-space: pre-wrap;
    }
    .bubble.user {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border-radius: 20px 20px 4px 20px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }
    .bubble.assistant {
      background: white; color: #1a1a2e;
      border-radius: 20px 20px 20px 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1px solid #f0f0f8;
    }

    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 14px 20px; }
    .typing-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #c084fc;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
    .pill-btn {
      padding: 8px 14px; border-radius: 50px;
      border: 1.5px solid #eef0f6; background: white;
      color: #64748b; cursor: pointer; font-size: 13px; font-weight: 500;
    }

    footer {
      background: white; border-top: 1px solid #eef0f6;
      padding: 14px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .input-row { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
    #userInput {
      flex: 1; padding: 13px 18px; border-radius: 50px;
      border: 1.5px solid #eef0f6; font-size: 15px;
      outline: none; background: #f8faff; color: #1a1a2e;
      transition: border-color 0.2s;
    }
    #userInput:focus { border-color: #6366f1; }
    #sendBtn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; cursor: pointer; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 4px 15px rgba(99,102,241,0.4);
      transition: all 0.2s;
    }
    #sendBtn:disabled { background: #e2e8f0; box-shadow: none; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="avatar">👩</div>
    <div>
      <div class="header-title">Fråga mamma</div>
      <div class="header-status"><span class="dot"></span> Alltid här för dig</div>
    </div>
  </header>

  <div id="chat">
    <div class="welcome-box" id="welcome">
      <div style="font-size:32px">👋</div>
      <h2>Hej! Jag är här för dig.</h2>
      <p>Undrar du något om vuxenlivet? Det finns inga dumma frågor — skriv vad du funderar på eller välj ett ämne nedan!</p>
    </div>

    <div id="categories">
      <p class="section-label">Välj ett ämne</p>
      <div class="category-grid">
        <button class="cat-btn" onclick="askCategory('Ekonomi & budget')"><span class="cat-emoji">💰</span> Ekonomi & budget</button>
        <button class="cat-btn" onclick="askCategory('Försäkringar & Försäkringskassan')"><span class="cat-emoji">🏥</span> Försäkringar & FK</button>
        <button class="cat-btn" onclick="askCategory('Jobb & A-kassa')"><span class="cat-emoji">💼</span> Jobb & A-kassa</button>
        <button class="cat-btn" onclick="askCategory('Mat & matlagning')"><span class="cat-emoji">🍝</span> Mat & recept</button>
        <button class="cat-btn" onclick="askCategory('Psykisk hälsa')"><span class="cat-emoji">🧠</span> Psykisk hälsa</button>
        <button class="cat-btn" onclick="askCategory('Boende & hyresrätt')"><span class="cat-emoji">🏠</span> Boende & hyra</button>
        <button class="cat-btn" onclick="askCategory('Myndigheter & blanketter')"><span class="cat-emoji">📋</span> Myndigheter</button>
        <button class="cat-btn" onclick="askCategory('Annat')"><span class="cat-emoji">❓</span> Annat</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <input id="userInput" type="text" placeholder="Skriv din fråga här..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </footer>

  <script>
    const SYSTEM_PROMPT = `Du är "Fråga mamma" — en varm, klok och omtänksam digital mamma som hjälper unga vuxna som precis har eller ska flytta hemifrån. Du svarar på frågor om allt som rör vuxenlivet: ekonomi, budget, jobb, A-kassa, Försäkringskassan, försäkringar, hyresrätt, mat och matlagning, psykisk hälsa, myndigheter, blanketter, och allt annat en ung person kan behöva veta. Svara alltid på svenska, varmt och enkelt. Avsluta gärna med en uppmuntrande mening. Om det handlar om psykisk ohälsa, påminn om 1177 eller Mind självmordslinjen 90101.`;

    let messages = [];

    function askCategory(cat) {
      sendMessage(`Kan du berätta om ${cat.toLowerCase()}? Vad behöver jag veta som ung vuxen?`);
    }

    async function sendMessage(overrideText) {
      const input = document.getElementById('userInput');
      const text = overrideText || input.value.trim();
      if (!text) return;

      document.getElementById('welcome')?.remove();
      document.getElementById('categories')?.remove();

      input.value = '';
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.innerHTML = `<div class="msg-avatar">👩</div><div class="bubble assistant"><div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
      document.getElementById('chat').appendChild(typingDiv);
      typingDiv.scrollIntoView({ behavior: 'smooth' });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: SYSTEM_PROMPT, messages }),
        });
        const data = await res.json();
        const reply = data.content?.[0]?.text || 'Något gick fel, försök igen!';
        typingDiv.remove();
        addMessage('assistant', reply);
        messages.push({ role: 'assistant', content: reply });
      } catch {
        typingDiv.remove();
        addMessage('assistant', 'Något gick fel 💛 Försök igen!');
      }

      sendBtn.disabled = false;
      addPills();
    }

    function addMessage(role, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'assistant') {
        div.innerHTML = `<div class="msg-avatar">👩</div><div class="bubble assistant">${text}</div>`;
      } else {
        div.innerHTML = `<div class="bubble user">${text}</div>`;
      }
      chat.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    let pillsAdded = false;
    function addPills() {
      if (pillsAdded) return;
      pillsAdded = true;
      const chat = document.getElementById('chat');
      const row = document.createElement('div');
      row.className = 'pill-row';
      const cats = [
        ['💰','Ekonomi & budget'],['🏥','Försäkringar & FK'],['💼','Jobb & A-kassa'],
        ['🍝','Mat & recept'],['🧠','Psykisk hälsa'],['🏠','Boende & hyra'],['📋','Myndigheter'],['❓','Annat']
      ];
      cats.forEach(([e, l]) => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn';
        btn.textContent = `${e} ${l}`;
        btn.onclick = () => askCategory(l);
        row.appendChild(btn);
      });
      chat.appendChild(row);
    }
  </script>
</body>
</html>
