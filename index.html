<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fråga mamma – hjälp för unga vuxna</title>

  <!-- Meta-taggar för Google -->
  <meta name="description" content="Fråga mamma – en AI-driven guide för unga vuxna som flyttar hemifrån. Få svar om ekonomi, jobb, A-kassa, försäkringar, boende, psykisk hälsa och mycket mer." />
  <meta name="keywords" content="fråga mamma, flytta hemifrån, unga vuxna, ekonomi, A-kassa, försäkringskassan, boende, psykisk hälsa, jobb" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Fråga mamma – hjälp för unga vuxna" />
  <meta property="og:description" content="Få svar på allt du undrar om vuxenlivet – som att fråga en klok mamma." />
  <meta property="og:url" content="https://www.fragamamma.se" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #f8faff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 1px solid #eef0f6;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 20px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a65, #e91e8c);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .header-title { font-weight: 800; font-size: 17px; color: #1a1a2e; }
    .header-status { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }

    #chat {
      flex: 1; overflow-y: auto;
      padding: 16px 12px;
      max-width: 680px; width: 100%; margin: 0 auto;
    }

    .welcome-box {
      background: white; border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      border: 1px solid #f0f0f8;
    }
    .welcome-box h2 { color: #1a1a2e; font-size: 18px; font-weight: 700; margin: 8px 0 6px; }
    .welcome-box p { color: #64748b; font-size: 14px; line-height: 1.7; }

    .section-label {
      color: #94a3b8; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }

    .category-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 28px;
    }
    .cat-btn {
      padding: 12px 14px; border-radius: 14px;
      border: 1.5px solid #eef0f6; background: white;
      color: #1a1a2e; cursor: pointer; font-size: 13px; font-weight: 600;
      text-align: left; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-btn:hover, .cat-btn:active { border-color: #6366f1; box-shadow: 0 4px 12px rgba(99,102,241,0.15); }
    .cat-emoji { font-size: 18px; }

    .message { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
    .message.user { justify-content: flex-end; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #ff8a65, #e91e8c);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .bubble {
      max-width: 80%; border-radius: 18px;
      padding: 12px 16px; font-size: 14px; line-height: 1.7;
    }
    .bubble.user {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }
    .bubble.assistant {
      background: white; color: #1a1a2e;
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1px solid #f0f0f8;
    }

    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #c084fc;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 20px; }
    .pill-btn {
      padding: 7px 12px; border-radius: 50px;
      border: 1.5px solid #eef0f6; background: white;
      color: #64748b; cursor: pointer; font-size: 12px; font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }

    footer {
      background: white; border-top: 1px solid #eef0f6;
      padding: 10px 12px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .input-row { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
    #userInput {
      flex: 1; padding: 12px 16px; border-radius: 50px;
      border: 1.5px solid #eef0f6; font-size: 15px;
      outline: none; background: #f8faff; color: #1a1a2e;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    #userInput:focus { border-color: #6366f1; }
    #sendBtn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 4px 15px rgba(99,102,241,0.4);
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #sendBtn:disabled { background: #e2e8f0; box-shadow: none; cursor: default; }

    /* GDPR-banner */
    #cookie-banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1a1a2e; color: white;
      padding: 14px 16px;
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between;
      z-index: 100; font-size: 13px; line-height: 1.5;
    }
    #cookie-banner p { flex: 1; min-width: 200px; color: #cbd5e1; }
    #cookie-banner a { color: #a5b4fc; text-decoration: underline; }
    #cookie-accept {
      padding: 9px 20px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }

    /* Mobiloptimering */
    @media (max-width: 480px) {
      .category-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
      .cat-btn { padding: 10px 10px; font-size: 12px; gap: 6px; }
      .cat-emoji { font-size: 16px; }
      .bubble { max-width: 88%; font-size: 14px; }
      .welcome-box h2 { font-size: 17px; }
      footer { padding-bottom: env(safe-area-inset-bottom, 16px); }
    }
  </style>
</head>
<body>
  <!-- GDPR Cookie-banner -->
  <div id="cookie-banner">
    <p>Vi använder inga spårningscookies. Chatten är anonym och dina frågor sparas inte. <a href="https://www.imy.se/verksamhet/dataskydd/det-har-galler-enligt-gdpr/" target="_blank">Läs mer om GDPR</a>.</p>
    <button id="cookie-accept" onclick="acceptCookies()">Okej, förstår!</button>
  </div>

  <header>
    <div class="avatar">👩</div>
    <div>
      <div class="header-title">Fråga mamma</div>
      <div class="header-status"><span class="dot"></span> Alltid här för dig</div>
    </div>
  </header>

  <div id="chat">
    <div class="welcome-box" id="welcome">
      <div style="font-size:30px">👋</div>
      <h2>Hej! Jag är här för dig.</h2>
      <p>Undrar du något om vuxenlivet? Det finns inga dumma frågor — skriv vad du funderar på eller välj ett ämne nedan!</p>
    </div>

    <div id="categories">
      <p class="section-label">Välj ett ämne</p>
      <div class="category-grid">
        <button class="cat-btn" onclick="askCategory('Ekonomi & budget')"><span class="cat-emoji">💰</span> Ekonomi & budget</button>
        <button class="cat-btn" onclick="askCategory('Försäkringar & Försäkringskassan')"><span class="cat-emoji">🏥</span> Försäkringar & FK</button>
        <button class="cat-btn" onclick="askCategory('Jobb & A-kassa')"><span class="cat-emoji">💼</span> Jobb & A-kassa</button>
        <button class="cat-btn" onclick="askCategory('Mat & matlagning')"><span class="cat-emoji">🍝</span> Mat & recept</button>
        <button class="cat-btn" onclick="askCategory('Psykisk hälsa')"><span class="cat-emoji">🧠</span> Psykisk hälsa</button>
        <button class="cat-btn" onclick="askCategory('Boende & hyresrätt')"><span class="cat-emoji">🏠</span> Boende & hyra</button>
        <button class="cat-btn" onclick="askCategory('Myndigheter & blanketter')"><span class="cat-emoji">📋</span> Myndigheter</button>
        <button class="cat-btn" onclick="askCategory('Annat')"><span class="cat-emoji">❓</span> Annat</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <input id="userInput" type="text" placeholder="Skriv din fråga här..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </footer>

  <script>
    // GDPR-banner
    if (localStorage.getItem('cookieOk')) {
      document.getElementById('cookie-banner').style.display = 'none';
    }
    function acceptCookies() {
      localStorage.setItem('cookieOk', '1');
      document.getElementById('cookie-banner').style.display = 'none';
    }

    const SYSTEM_PROMPT = `Du är "Fråga mamma" — en varm, klok och omtänksam digital mamma som hjälper unga vuxna som precis har eller ska flytta hemifrån. Du svarar på frågor om allt som rör vuxenlivet: ekonomi, budget, jobb, A-kassa, Försäkringskassan, försäkringar, hyresrätt, mat och matlagning, psykisk hälsa, myndigheter, blanketter, och allt annat en ung person kan behöva veta. Svara alltid på svenska, varmt och enkelt. Avsluta gärna med en uppmuntrande mening. Om det handlar om psykisk ohälsa, påminn om 1177 eller Mind självmordslinjen 90101.`;

    let messages = [];

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^### (.+)$/gm, '<h3 style="font-size:14px;font-weight:700;margin:10px 0 4px;color:#1a1a2e">$1</h3>')
        .replace(/^## (.+)$/gm, '<h2 style="font-size:15px;font-weight:700;margin:10px 0 4px;color:#1a1a2e">$1</h2>')
        .replace(/^- (.+)$/gm, '<li style="margin:4px 0;padding-left:4px">$1</li>')
        .replace(/(<li.*<\/li>)/gs, '<ul style="padding-left:18px;margin:6px 0">$1</ul>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    function askCategory(cat) {
      sendMessage(`Kan du berätta om ${cat.toLowerCase()}? Vad behöver jag veta som ung vuxen?`);
    }

    async function sendMessage(overrideText) {
      const input = document.getElementById('userInput');
      const text = overrideText || input.value.trim();
      if (!text) return;

      document.getElementById('welcome')?.remove();
      document.getElementById('categories')?.remove();

      input.value = '';
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `<div class="msg-avatar">👩</div><div class="bubble assistant"><div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
      chat.appendChild(msgDiv);
      msgDiv.scrollIntoView({ behavior: 'smooth' });

      const bubble = msgDiv.querySelector('.bubble');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: SYSTEM_PROMPT, messages, stream: true }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        bubble.innerHTML = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') break;
              try {
                const json = JSON.parse(data);
                const delta = json.delta?.text || '';
                if (delta) {
                  fullText += delta;
                  bubble.innerHTML = formatText(fullText);
                  chat.scrollTop = chat.scrollHeight;
                }
              } catch {}
            }
          }
        }
        messages.push({ role: 'assistant', content: fullText });
      } catch {
        bubble.innerHTML = 'Något gick fel 💛 Försök igen!';
      }

      sendBtn.disabled = false;
      addPills();
    }

    function addMessage(role, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'user') {
        div.innerHTML = `<div class="bubble user">${text}</div>`;
      }
      chat.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    let pillsAdded = false;
    function addPills() {
      if (pillsAdded) return;
      pillsAdded = true;
      const chat = document.getElementById('chat');
      const row = document.createElement('div');
      row.className = 'pill-row';
      const cats = [
        ['💰','Ekonomi & budget'],['🏥','Försäkringar & FK'],['💼','Jobb & A-kassa'],
        ['🍝','Mat & recept'],['🧠','Psykisk hälsa'],['🏠','Boende & hyra'],['📋','Myndigheter'],['❓','Annat']
      ];
      cats.forEach(([e, l]) => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn';
        btn.textContent = `${e} ${l}`;
        btn.onclick = () => askCategory(l);
        row.appendChild(btn);
      });
      chat.appendChild(row);
    }
  </script>
</body>
</html>
